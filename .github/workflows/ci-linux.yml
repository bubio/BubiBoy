name: CI Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-macos.yml"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-macos.yml"
      - ".github/workflows/ci-windows.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test, and publish Linux ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            appimage_arch: x86_64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.107

      - name: Build native audio
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native -B native/build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/cmake --config Release

          library="libbubi_miniaudio.so"
          destination="native/build/runtimes/${{ matrix.rid }}/native"
          mkdir -p "${destination}"
          cp "native/build/cmake/${library}" "${destination}/${library}"

      - name: Restore
        run: dotnet restore BubiBoy.slnx

      - name: Build
        run: dotnet build BubiBoy.slnx --no-restore

      - name: Test
        env:
          BUBIBOY_EXPECT_NATIVE_AUDIO: "1"
        run: dotnet test BubiBoy.slnx --no-build

      - name: Publish app
        run: dotnet publish src/BubiBoy.App/BubiBoy.App.fsproj -c Release -r ${{ matrix.rid }} --no-restore --self-contained true

      - name: Copy native audio into published app
        shell: bash
        run: |
          set -euo pipefail

          destination="src/BubiBoy.App/bin/Release/net10.0/${{ matrix.rid }}/publish/runtimes/${{ matrix.rid }}/native"
          mkdir -p "${destination}"
          cp native/build/runtimes/${{ matrix.rid }}/native/* "${destination}/"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          publish_directory="src/BubiBoy.App/bin/Release/net10.0/${{ matrix.rid }}/publish"
          appdir="artifacts/appimage/${{ matrix.rid }}/AppDir"

          mkdir -p "${appdir}/usr/lib/bubiboy"
          mkdir -p "${appdir}/usr/share/icons/hicolor/256x256/apps"
          cp -a "${publish_directory}/." "${appdir}/usr/lib/bubiboy/"
          cp src/BubiBoy.App/Assets/AppIcon.png "${appdir}/usr/share/icons/hicolor/256x256/apps/bubiboy.png"
          cp src/BubiBoy.App/Assets/AppIcon.png "${appdir}/bubiboy.png"

          cat > "${appdir}/BubiBoy.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=BubiBoy
          Comment=Game Boy and Game Boy Color emulator
          Exec=BubiBoy
          Icon=bubiboy
          Categories=Game;Emulator;
          Terminal=false
          EOF

          cat > "${appdir}/AppRun" <<'EOF'
          #!/usr/bin/env sh
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "$APPDIR/usr/lib/bubiboy/BubiBoy" "$@"
          EOF

          chmod +x "${appdir}/AppRun"
          chmod +x "${appdir}/usr/lib/bubiboy/BubiBoy"

          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.appimage_arch }} ./appimagetool --appimage-extract-and-run "${appdir}" "artifacts/BubiBoy-${{ matrix.rid }}.AppImage"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: BubiBoy-${{ matrix.rid }}
          path: artifacts/BubiBoy-${{ matrix.rid }}.AppImage
          if-no-files-found: error

      - name: Upload to release
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/BubiBoy-${{ matrix.rid }}.AppImage
          asset_name: BubiBoy-${{ matrix.rid }}.AppImage
          overwrite: true
          tag: ${{ github.ref_name }}
