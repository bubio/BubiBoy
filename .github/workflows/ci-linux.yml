name: CI Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-macos.yml"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-macos.yml"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, test, and publish Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.107

      - name: Build native audio
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native -B native/build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/cmake --config Release

          rid="linux-x64"
          library="libbubi_miniaudio.so"
          destination="native/build/runtimes/${rid}/native"
          mkdir -p "${destination}"
          cp "native/build/cmake/${library}" "${destination}/${library}"

      - name: Restore
        run: dotnet restore BubiBoy.slnx

      - name: Build
        run: dotnet build BubiBoy.slnx --no-restore

      - name: Test
        env:
          BUBIBOY_EXPECT_NATIVE_AUDIO: "1"
        run: dotnet test BubiBoy.slnx --no-build

      - name: Publish app
        run: dotnet publish src/BubiBoy.App/BubiBoy.App.fsproj -c Release -r linux-x64 --no-restore --self-contained true

      - name: Copy native audio into published app
        shell: bash
        run: |
          set -euo pipefail

          destination="src/BubiBoy.App/bin/Release/net10.0/linux-x64/publish/runtimes/linux-x64/native"
          mkdir -p "${destination}"
          cp native/build/runtimes/linux-x64/native/* "${destination}/"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          publish_directory="src/BubiBoy.App/bin/Release/net10.0/linux-x64/publish"
          appdir="artifacts/appimage/AppDir"

          mkdir -p "${appdir}/usr/lib/bubiboy"
          mkdir -p "${appdir}/usr/share/icons/hicolor/256x256/apps"
          cp -a "${publish_directory}/." "${appdir}/usr/lib/bubiboy/"
          cp src/BubiBoy.App/Assets/AppIcon.png "${appdir}/usr/share/icons/hicolor/256x256/apps/bubiboy.png"
          cp src/BubiBoy.App/Assets/AppIcon.png "${appdir}/bubiboy.png"

          cat > "${appdir}/BubiBoy.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=BubiBoy
          Comment=Game Boy and Game Boy Color emulator
          Exec=BubiBoy
          Icon=bubiboy
          Categories=Game;Emulator;
          Terminal=false
          EOF

          cat > "${appdir}/AppRun" <<'EOF'
          #!/usr/bin/env sh
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "$APPDIR/usr/lib/bubiboy/BubiBoy" "$@"
          EOF

          chmod +x "${appdir}/AppRun"
          chmod +x "${appdir}/usr/lib/bubiboy/BubiBoy"

          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${appdir}" "artifacts/BubiBoy-linux-x64.AppImage"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubiBoy-linux-x64
          path: artifacts/BubiBoy-linux-x64.AppImage
          if-no-files-found: error
