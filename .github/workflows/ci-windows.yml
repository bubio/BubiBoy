name: CI Windows

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-linux.yml"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-linux.yml"
      - ".github/workflows/ci-macos.yml"
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, test, and publish Windows ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.107

      - name: Build native audio
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native -B native/build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/cmake --config Release

          library="bubi_miniaudio.dll"
          destination="native/build/runtimes/${{ matrix.rid }}/native"
          mkdir -p "${destination}"
          cp "native/build/cmake/Release/${library}" "${destination}/${library}"

      - name: Restore
        run: dotnet restore BubiBoy.slnx

      - name: Build
        run: dotnet build BubiBoy.slnx --no-restore

      - name: Test
        env:
          BUBIBOY_EXPECT_NATIVE_AUDIO: "1"
        run: dotnet test BubiBoy.slnx --no-build

      - name: Publish app
        run: >
          dotnet publish src/BubiBoy.App/BubiBoy.App.fsproj
          -c Release
          -r ${{ matrix.rid }}
          --no-restore
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Prepare app artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact_directory="artifacts/BubiBoy-${{ matrix.rid }}"
          mkdir -p "${artifact_directory}"
          cp src/BubiBoy.App/bin/Release/net10.0/${{ matrix.rid }}/publish/BubiBoy.exe "${artifact_directory}/"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubiBoy-${{ matrix.rid }}
          path: artifacts/BubiBoy-${{ matrix.rid }}
          if-no-files-found: error
