name: CI macOS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-linux.yml"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths-ignore:
      - "**/*.adoc"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.txt"
      - "**/*LICENSE*"
      - "docs/**"
      - ".github/workflows/ci-linux.yml"
      - ".github/workflows/ci-windows.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test, and publish macOS ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.107

      - name: Build native libraries
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native -B native/build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/cmake --config Release

          library="libbubi_miniaudio.dylib"
          destination="native/build/runtimes/${{ matrix.rid }}/native"
          mkdir -p "${destination}"
          cp "native/build/cmake/${library}" "${destination}/${library}"

          ra_library="libbubi_rcheevos.dylib"
          ra_build="native/bubi_rcheevos/build/cmake/${{ matrix.rid }}"
          ra_destination="native/bubi_rcheevos/build/runtimes/${{ matrix.rid }}/native"
          cmake -S native/bubi_rcheevos -B "${ra_build}" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${ra_build}" --config Release
          ctest --test-dir "${ra_build}" --output-on-failure
          mkdir -p "${ra_destination}"
          cp "${ra_build}/${ra_library}" "${ra_destination}/${ra_library}"

      - name: Restore
        run: dotnet restore BubiBoy.slnx

      - name: Build
        run: dotnet build BubiBoy.slnx --no-restore

      - name: Test
        env:
          BUBIBOY_EXPECT_NATIVE_AUDIO: "1"
        run: dotnet test BubiBoy.slnx --no-build

      - name: Publish app
        run: dotnet publish src/BubiBoy.App/BubiBoy.App.fsproj -c Release -r ${{ matrix.rid }} --no-restore --self-contained true

      - name: Copy native libraries into published app
        shell: bash
        run: |
          set -euo pipefail

          publish_path="src/BubiBoy.App/bin/Release/${{ matrix.rid }}/BubiBoy.app"
          destination="${publish_path}/Contents/MacOS/runtimes/${{ matrix.rid }}/native"
          mkdir -p "${destination}"
          cp native/build/runtimes/${{ matrix.rid }}/native/* "${destination}/"
          cp native/bubi_rcheevos/build/runtimes/${{ matrix.rid }}/native/* "${destination}/"

          test -f "${publish_path}/Contents/MacOS/libbubi_rcheevos.dylib"
          test -f "${destination}/libbubi_miniaudio.dylib"
          test -f "${destination}/libbubi_rcheevos.dylib"
          codesign --force --deep --sign - "${publish_path}"

      - name: Prepare app artifact
        shell: bash
        run: |
          set -euo pipefail

          publish_path="src/BubiBoy.App/bin/Release/${{ matrix.rid }}/BubiBoy.app"
          artifact_directory="artifacts/BubiBoy-${{ matrix.rid }}"
          mkdir -p "${artifact_directory}"
          cp -R "${publish_path}" "${artifact_directory}/"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: BubiBoy-${{ matrix.rid }}
          path: artifacts/BubiBoy-${{ matrix.rid }}
          if-no-files-found: error

      - name: Package app for release
        if: ${{ github.event_name == 'release' && !env.ACT }}
        shell: bash
        run: |
          set -euo pipefail

          ditto -c -k --sequesterRsrc --keepParent \
            "src/BubiBoy.App/bin/Release/${{ matrix.rid }}/BubiBoy.app" \
            "BubiBoy-${{ matrix.rid }}.zip"

      - name: Upload to release
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BubiBoy-${{ matrix.rid }}.zip
          asset_name: BubiBoy-${{ matrix.rid }}.zip
          overwrite: true
          tag: ${{ github.ref_name }}
