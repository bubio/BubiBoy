name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.107

      - name: Build native audio
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native -B native/build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/cmake --config Release

          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64)
              rid="osx-arm64"
              library="libbubi_miniaudio.dylib"
              source="native/build/cmake/${library}"
              ;;
            macOS-X64)
              rid="osx-x64"
              library="libbubi_miniaudio.dylib"
              source="native/build/cmake/${library}"
              ;;
            Linux-X64)
              rid="linux-x64"
              library="libbubi_miniaudio.so"
              source="native/build/cmake/${library}"
              ;;
            Windows-X64)
              rid="win-x64"
              library="bubi_miniaudio.dll"
              source="native/build/cmake/Release/${library}"
              ;;
            *)
              echo "Unsupported native audio target: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          destination="native/build/runtimes/${rid}/native"
          mkdir -p "${destination}"
          cp "${source}" "${destination}/${library}"

      - name: Restore
        run: dotnet restore BubiBoy.slnx

      - name: Build
        run: dotnet build BubiBoy.slnx --no-restore

      - name: Test
        env:
          BUBIBOY_EXPECT_NATIVE_AUDIO: "1"
        run: dotnet test BubiBoy.slnx --no-build

      - name: Upload native audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubi-miniaudio-${{ runner.os }}-${{ runner.arch }}
          path: native/build/runtimes
          if-no-files-found: error
